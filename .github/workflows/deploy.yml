name: Deploy to Namecheap
on:
  push:
    branches: ['**']

# One deploy per branch at a time. If several pushes pile up, only the newest waits;
# the in-between ones are skipped instead of uploading outdated files.
concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15   # a stuck run gives up after 15 minutes instead of 6 hours
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Re-running an old run (or a slow run finishing late) would upload OLD files and an
      # old changelog over newer ones. Only deploy if this commit is still the newest one.
      - name: Check this is the newest commit
        id: newest
        if: github.ref_name == 'Release' || github.ref_name == 'staging'
        run: |
          latest=$(git ls-remote origin "refs/heads/${{ github.ref_name }}" | cut -f1)
          if [ "$latest" = "${{ github.sha }}" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
            echo "This is the newest commit on ${{ github.ref_name }}, deploying."
          else
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Skipping deploy: ${{ github.ref_name }} has a newer commit ($latest), which gets its own deploy."
          fi

      - name: Compute version + changelog
        if: steps.newest.outputs.deploy == 'true'
        env:
          BRANCH: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_BEFORE: ${{ github.event.before }}
        run: |
          python3 << 'EOF'
          import json, os, re, subprocess, urllib.request
          from datetime import datetime
          from zoneinfo import ZoneInfo

          BRANCH = os.environ["BRANCH"]
          REPO = os.environ["REPO"]
          RS, US = "\x1e", "\x1f"

          # Same rule as the Discord step: a "Co-Authored-By: Claude ..." line marks the commit
          # as made with Claude, and the line itself is removed from the changelog text.
          CLAUDE_TRAILER = re.compile(r"^[ \t]*Co-Authored-By:[ \t]*Claude[^\n]*$", re.IGNORECASE | re.MULTILINE)

          def git_log(args):
              raw = subprocess.run(
                  ["git", "log", "--reverse", "--date=format:%Y-%m",
                   f"--pretty=format:{RS}%H{US}%P{US}%ad{US}%aI{US}%an{US}%s{US}%b"] + args,
                  capture_output=True, text=True, check=True).stdout
              commits = []
              for record in raw.split(RS):
                  record = record.strip("\n")
                  if not record:
                      continue
                  commit_hash, parents, year_month, iso_date, author_name, subject, body = record.split(US, 6)
                  subject, body = subject.strip(), body.strip()
                  # GitHub merge commits look like "Merge pull request #3 from ...", with the
                  # pull request title as the first line of the body. Use title + description instead.
                  if subject.startswith("Merge pull request") and body:
                      lines = body.split("\n", 1)
                      subject = lines[0].strip()
                      body = lines[1].strip() if len(lines) > 1 else ""
                  claude = bool(CLAUDE_TRAILER.search(body))
                  body = CLAUDE_TRAILER.sub("", body).strip()
                  commits.append({
                      "hash": commit_hash,
                      "parents": parents.split(),
                      "year_month": year_month,
                      "date": iso_date[:10],
                      "author_name": author_name.strip(),
                      "claude": claude,
                      "subject": subject,
                      "body": body,
                  })
              return commits

          def short(year_month):
              return year_month[2:].replace("-", ".")

          def entry(version, c):
              return {"version": version, "date": c["date"], "subject": c["subject"], "body": c["body"],
                      "claude": c["claude"], "hash": c["hash"], "author_name": c["author_name"]}

          # One entry for a whole release: every commit's description in order (a commit without
          # one shows its summary as a bullet), led by the pull request's description if merged.
          # Bullet lists from different commits run together as one list. Signed by whoever made
          # the newest commit, "with Claude" if Claude helped with any of them.
          def release_entry(version, merge, commits):
              parts = [merge["body"]] if merge and merge["body"] else []
              parts += [c["body"] or f"- {c['subject']}" for c in commits]
              body = re.sub(r"^([-*•][ \t].*)\n[ \t]*\n(?=[-*•][ \t])", r"\1\n", "\n\n".join(parts), flags=re.MULTILINE)
              last = merge or commits[-1]
              return {"version": version, "date": last["date"], "subject": last["subject"], "body": body,
                      "claude": any(c["claude"] for c in commits + ([merge] if merge else [])),
                      "hash": last["hash"], "author_name": last["author_name"]}

          # Looks up who made a commit on GitHub, so the changelog can show the same name and
          # profile link as the Discord messages. Results are remembered, so each commit and each
          # person is only asked about once. If GitHub can't be reached, the name from git is used.
          def github_api(path):
              req = urllib.request.Request(
                  f"https://api.github.com/{path}",
                  headers={
                      "User-Agent": "DiscordBot (https://github.com, 1.0)",
                      "Accept": "application/vnd.github+json",
                      "Authorization": f"Bearer {os.environ['GITHUB_TOKEN']}",
                  })
              with urllib.request.urlopen(req, timeout=15) as res:
                  return json.loads(res.read())

          user_cache = {}
          def author_of(commit_hash, fallback_name):
              try:
                  login = (github_api(f"repos/{REPO}/commits/{commit_hash}").get("author") or {}).get("login")
              except Exception as e:
                  print(f"Could not look up commit {commit_hash[:7]} ({e}), using git name.")
                  login = None
              if not login:
                  return {"name": fallback_name, "url": None}
              if login not in user_cache:
                  try:
                      name = github_api(f"users/{login}").get("name") or login
                  except Exception:
                      name = login
                  user_cache[login] = {"name": name, "url": f"https://github.com/{login}"}
              return user_cache[login]

          # Release numbers always come from the Release branch only: ONE NUMBER PER PUSH to Release.
          # It doesn't matter how the commits got there (a pull request, a merge in GitHub Desktop
          # that fast-forwarded, or several commits pushed at once), each push is one release.
          release_ref = "HEAD" if BRANCH == "Release" else "origin/Release"
          ZERO = "0" * 40

          def first_parent_hashes(rev_range):
              try:
                  return subprocess.run(["git", "rev-list", "--first-parent", rev_range],
                                        capture_output=True, text=True, check=True).stdout.split()
              except subprocess.CalledProcessError:
                  return []

          # GitHub's record of every push to Release: which commit the branch was on before the
          # push, and which commit it was on after.
          pushes = []
          for page in range(1, 31):
              try:
                  items = github_api(f"repos/{REPO}/activity?ref=refs/heads/Release&per_page=100&page={page}")
              except Exception as e:
                  print(f"::warning::Could not read the push history of Release ({e}). Commits not found in it count one by one.")
                  break
              for a in items:
                  if a.get("ref") in ("refs/heads/Release", "Release"):
                      pushes.append((a.get("timestamp") or "", a.get("before") or "", a.get("after") or ""))
              if len(items) < 100:
                  break
          pushes.sort()  # oldest first
          push_ranges = [(before, after) for _, before, after in pushes]

          # The push that started this very run, in case GitHub hasn't listed it yet.
          event_before = os.environ.get("EVENT_BEFORE", "")
          if BRANCH == "Release" and event_before:
              push_ranges.append((event_before, "HEAD"))

          # Remember which push brought in each commit on Release.
          push_of = {}
          for i, (before, after) in enumerate(push_ranges):
              if not before or not after or before == ZERO or after == ZERO:
                  continue  # creating or deleting the branch isn't a release
              for h in first_parent_hashes(f"{before}..{after}"):
                  push_of.setdefault(h, i)

          # Group the commits on Release by the push that brought them in. A commit that isn't
          # found in the push history counts on its own, like before.
          groups = []
          for c in git_log(["--first-parent", release_ref]):
              key = push_of.get(c["hash"])
              if groups and key is not None and groups[-1]["key"] == key:
                  groups[-1]["commits"].append(c)
              else:
                  groups.append({"key": key, "commits": [c]})

          entries = []
          counts = {}
          release_version = "00.00-0"
          for g in groups:
              start, end = g["commits"][0], g["commits"][-1]
              ym = end["year_month"]
              counts[ym] = counts.get(ym, 0) + 1
              version = f"{short(ym)}-{counts[ym]}"
              release_version = version

              # A release is ONE entry (26.10-17) with the changes of every commit it brought in,
              # oldest first. A merged pull request's title and description lead, when there is one.
              is_merge = len(end["parents"]) > 1
              base = start["parents"][0] if start["parents"] else None
              range_args = [f"{base}..{end['hash']}"] if base else [end["hash"]]
              brought_in = git_log(["--no-merges"] + range_args)
              if not brought_in and not is_merge:
                  brought_in = [end]
              entries.append(release_entry(version, end if is_merge else None, brought_in))

          if BRANCH == "staging":
              # Staging also shows what the NEXT release will contain, one entry per change, numbered
              # within the number that release will get: 26.10-18-1, 26.10-18-2, ... (as long as
              # it's released in the same month). Once released, they become the one 26.10-18 entry.
              this_month = datetime.now(ZoneInfo("Europe/Berlin")).strftime("%Y-%m")
              upcoming = f"{short(this_month)}-{counts.get(this_month, 0) + 1}"

              pending = git_log(["--no-merges", "origin/Release..HEAD"])
              for i, c in enumerate(pending, start=1):
                  entries.append(entry(f"{upcoming}-{i}", c))

          # The live site shows the release number (26.10-23). Staging shows its newest pending
          # change (26.10-24-2), or the current release if nothing is pending.
          version = release_version
          if BRANCH == "staging" and pending:
              version = f"{upcoming}-{len(pending)}"
          with open("version.json", "w") as f:
              json.dump({"version": version}, f)

          # Newest first, capped so the file doesn't grow unbounded over the repo's life.
          changelog = list(reversed(entries))[:50]
          for e in changelog:
              e["author"] = author_of(e.pop("hash"), e.pop("author_name"))
          with open("changelog.json", "w") as f:
              json.dump(changelog, f, indent=2)

          print(f"Branch: {BRANCH}")
          print(f"Version: {version}")
          print(f"Changelog entries written: {len(changelog)}")
          EOF

      - name: Block crawlers on staging
        if: github.ref_name == 'staging' && steps.newest.outputs.deploy == 'true'
        run: |
          # Only the staging copy gets this file. The live site keeps its own robots.txt (or none).
          printf 'User-agent: *\nDisallow: /\n' > robots.txt
          echo "Wrote staging robots.txt:"
          cat robots.txt

      - name: Deploy via FTP
        if: steps.newest.outputs.deploy == 'true'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ${{ github.ref_name == 'Release' && '/public_html/' || '/staging_html/' }}

      - name: Notify Discord
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          # Separate webhook for commits co-authored by Claude. If this secret doesn't exist yet,
          # those commits still post through the normal webhook, just under Claude's name.
          DISCORD_WEBHOOK_CLAUDE: ${{ secrets.DISCORD_WEBHOOK_CLAUDE }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # All commits in this push, passed in as a variable instead of pasted into the script,
          # so quotes or backslashes in a commit message can't break the Python code.
          COMMITS_JSON: ${{ toJSON(github.event.commits) }}
          HEAD_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          python3 << 'EOF'
          import os, re, json, urllib.request

          repo = "${{ github.repository }}"
          repo_name = repo.split("/")[1]
          branch = "${{ github.ref_name }}"
          actor = "${{ github.actor }}"

          # A push can carry several commits (for example when staging is merged into Release).
          # Every commit's description is posted, oldest first, so nothing gets lost.
          # Merge commits are skipped, since the commits they bring in are already listed.
          try:
            commits = json.loads(os.environ.get("COMMITS_JSON") or "[]") or []
          except Exception:
            commits = []
          messages = [c.get("message", "") for c in commits
                      if not c.get("message", "").startswith(("Merge pull request", "Merge branch", "Merge remote-tracking"))]
          if not messages:
            messages = [os.environ.get("HEAD_MESSAGE", "")]

          # A "Co-Authored-By: Claude ... <email>" line means Claude helped. It's removed from the
          # text, and if any commit in the push has it, the message posts as "Claude".
          claude_pattern = re.compile(
            r"^[ \t]*Co-Authored-By:[ \t]*Claude[^<\n]*?[ \t]*(<[^>\n]*>)?[ \t]*$",
            re.IGNORECASE | re.MULTILINE
          )
          claude_name = None
          bodies = []
          for message in messages:
            # Split summary and description; use the description, or the summary if there is none.
            parts = message.split("\n", 1)
            subject = parts[0].strip()
            body = parts[1].strip() if len(parts) > 1 else ""
            if claude_pattern.search(body):
              claude_name = "Claude"
              body = claude_pattern.sub("", body).strip()
            bodies.append(body or subject)
          body = "\n\n".join(b for b in bodies if b)

          # Discord allows 2000 characters per message. Leave room for the footer line.
          LIMIT = 1700
          if len(body) > LIMIT:
            body = body[:LIMIT].rsplit("\n", 1)[0].rstrip() + "\n\n…and more, see the full list on GitHub."

          # Fetch GitHub display name. Signed in with the workflow's own token, because
          # anonymous requests share a small hourly limit with everyone on GitHub's servers.
          # If it still fails, fall back to the username instead of skipping the message.
          display_name = actor
          try:
            req = urllib.request.Request(
              f"https://api.github.com/users/{actor}",
              headers={
                "User-Agent": "DiscordBot (https://github.com, 1.0)",
                "Accept": "application/vnd.github+json",
                "Authorization": f"Bearer {os.environ['GITHUB_TOKEN']}"
              }
            )
            with urllib.request.urlopen(req, timeout=15) as res:
              user_data = json.loads(res.read())
            display_name = user_data.get("name") or actor
          except Exception as e:
            print(f"Could not fetch display name ({e}), using '{actor}' instead.")

          footer_place = f"[{repo_name}/{branch}](<https://github.com/{repo}/tree/{branch}>)"
          footer_person = f"[{display_name}](<https://github.com/{actor}>)"

          if claude_name:
            # Posts as Claude. The profile picture comes from the Claude webhook's own settings
            # in Discord, so no avatar is sent here.
            webhook = os.environ.get("DISCORD_WEBHOOK_CLAUDE") or os.environ["DISCORD_WEBHOOK"]
            payload = {
              "username": claude_name,
              "content": f"{body}\n\n- [{claude_name}](<https://github.com/claude>) with {footer_person} on {footer_place}"
            }
            print(f"Claude co-authored commit, posting as '{claude_name}'.")
          else:
            webhook = os.environ["DISCORD_WEBHOOK"]
            payload = {
              "username": display_name,
              "avatar_url": f"https://github.com/{actor}.png",
              "content": f"{body}\n\n- {footer_person} on {footer_place}"
            }

          data = json.dumps(payload).encode("utf-8")
          req = urllib.request.Request(
            webhook + "?wait=true",
            data=data,
            headers={
              "Content-Type": "application/json",
              "User-Agent": "DiscordBot (https://github.com, 1.0)"
            },
            method="POST"
          )
          urllib.request.urlopen(req)
          EOF