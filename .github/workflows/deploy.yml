name: Deploy to Namecheap
on:
  push:
    branches: ['**']

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute version + changelog
        if: github.ref_name == 'Release' || github.ref_name == 'staging'
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          python3 << 'EOF'
          import json, os, subprocess
          from datetime import datetime
          from zoneinfo import ZoneInfo

          BRANCH = os.environ["BRANCH"]
          RS, US = "\x1e", "\x1f"

          def read_log(rev_range, first_parent):
              cmd = ["git", "log", "--reverse", "--date=format:%Y-%m",
                     f"--pretty=format:{RS}%H{US}%ad{US}%aI{US}%s{US}%b"]
              if first_parent:
                  # Only commits made directly on this branch (plus one per merge).
                  # Commits that arrive through a merge are not counted.
                  cmd.append("--first-parent")
              cmd.append(rev_range)
              raw = subprocess.run(cmd, capture_output=True, text=True, check=True).stdout

              commits = []
              for record in raw.split(RS):
                  record = record.strip("\n")
                  if not record:
                      continue
                  commit_hash, year_month, iso_date, subject, body = record.split(US, 4)
                  subject, body = subject.strip(), body.strip()

                  # GitHub merge commits look like "Merge pull request #3 from ...",
                  # with the pull request title as the first line of the body.
                  # Use the pull request title and description for the changelog instead.
                  if subject.startswith("Merge pull request") and body:
                      lines = body.split("\n", 1)
                      subject = lines[0].strip()
                      body = lines[1].strip() if len(lines) > 1 else ""

                  commits.append({
                      "year_month": year_month,
                      "date": iso_date[:10],
                      "subject": subject,
                      "body": body,
                  })
              return commits

          def short(year_month):
              return year_month[2:].replace("-", ".")

          # Release numbers always come from the Release branch only.
          release_ref = "HEAD" if BRANCH == "Release" else "origin/Release"

          entries = []
          counts = {}
          for c in read_log(release_ref, True):
              ym = c["year_month"]
              counts[ym] = counts.get(ym, 0) + 1
              entries.append({
                  "version": f"{short(ym)}-{counts[ym]}",
                  "date": c["date"],
                  "subject": c["subject"],
                  "body": c["body"],
              })

          if BRANCH == "staging":
              # Staging shows which release it is building toward, e.g. 26.10-13-staging.4
              this_month = datetime.now(ZoneInfo("Europe/Berlin")).strftime("%Y-%m")
              upcoming = f"{short(this_month)}-{counts.get(this_month, 0) + 1}"

              staging_commits = read_log("origin/Release..HEAD", False)
              for i, c in enumerate(staging_commits, start=1):
                  entries.append({
                      "version": f"{upcoming}-staging.{i}",
                      "date": c["date"],
                      "subject": c["subject"],
                      "body": c["body"],
                  })

          version = entries[-1]["version"] if entries else "00.00-0"
          with open("version.json", "w") as f:
              json.dump({"version": version}, f)

          # Newest first, capped so the file doesn't grow unbounded over the repo's life.
          changelog = list(reversed(entries))[:30]
          with open("changelog.json", "w") as f:
              json.dump(changelog, f, indent=2)

          print(f"Branch: {BRANCH}")
          print(f"Version: {version}")
          print(f"Changelog entries written: {len(changelog)}")
          EOF

      - name: Block crawlers on staging
        if: github.ref_name == 'staging'
        run: |
          # Only the staging copy gets this file. The live site keeps its own robots.txt (or none).
          printf 'User-agent: *\nDisallow: /\n' > robots.txt
          echo "Wrote staging robots.txt:"
          cat robots.txt

      - name: Deploy via FTP
        if: github.ref_name == 'Release' || github.ref_name == 'staging'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ${{ github.ref_name == 'Release' && '/public_html/' || '/staging_html/' }}

      - name: Notify Discord
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          python3 << 'EOF'
          import os, json, urllib.request

          message = """${{ github.event.commits[0].message }}"""
          repo = "${{ github.repository }}"
          repo_name = repo.split("/")[1]
          branch = "${{ github.ref_name }}"
          actor = "${{ github.actor }}"

          # Split summary and description
          parts = message.split("\n", 1)
          body = parts[1].strip() if len(parts) > 1 else parts[0].strip()

          # Fetch GitHub display name
          req = urllib.request.Request(
            f"https://api.github.com/users/{actor}",
            headers={
              "User-Agent": "DiscordBot (https://github.com, 1.0)",
              "Accept": "application/vnd.github+json"
            }
          )
          with urllib.request.urlopen(req) as res:
            user_data = json.loads(res.read())
          display_name = user_data.get("name") or actor

          payload = {
            "username": display_name,
            "avatar_url": f"https://github.com/{actor}.png",
            "content": f"{body}\n\n- [{display_name}](<https://github.com/{actor}>) on [{repo_name}/{branch}](<https://github.com/{repo}/tree/{branch}>)"
          }

          data = json.dumps(payload).encode("utf-8")
          req = urllib.request.Request(
            os.environ["DISCORD_WEBHOOK"] + "?wait=true",
            data=data,
            headers={
              "Content-Type": "application/json",
              "User-Agent": "DiscordBot (https://github.com, 1.0)"
            },
            method="POST"
          )
          urllib.request.urlopen(req)
          EOF