name: Deploy to Namecheap
on:
  push:
    branches: ['**']

# One deploy per branch at a time. If several pushes pile up, only the newest waits;
# the in-between ones are skipped instead of uploading outdated files.
concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15   # a stuck run gives up after 15 minutes instead of 6 hours
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Re-running an old run (or a slow run finishing late) would upload OLD files and an
      # old changelog over newer ones. Only deploy if this commit is still the newest one.
      - name: Check this is the newest commit
        id: newest
        if: github.ref_name == 'Release' || github.ref_name == 'staging'
        run: |
          latest=$(git ls-remote origin "refs/heads/${{ github.ref_name }}" | cut -f1)
          if [ "$latest" = "${{ github.sha }}" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
            echo "This is the newest commit on ${{ github.ref_name }}, deploying."
          else
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Skipping deploy: ${{ github.ref_name }} has a newer commit ($latest), which gets its own deploy."
          fi

      - name: Compute version + changelog
        if: steps.newest.outputs.deploy == 'true'
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          python3 << 'EOF'
          import json, os, subprocess
          from datetime import datetime
          from zoneinfo import ZoneInfo

          BRANCH = os.environ["BRANCH"]
          RS, US = "\x1e", "\x1f"

          def git_log(args):
              raw = subprocess.run(
                  ["git", "log", "--reverse", "--date=format:%Y-%m",
                   f"--pretty=format:{RS}%H{US}%P{US}%ad{US}%aI{US}%s{US}%b"] + args,
                  capture_output=True, text=True, check=True).stdout
              commits = []
              for record in raw.split(RS):
                  record = record.strip("\n")
                  if not record:
                      continue
                  commit_hash, parents, year_month, iso_date, subject, body = record.split(US, 5)
                  subject, body = subject.strip(), body.strip()
                  # GitHub merge commits look like "Merge pull request #3 from ...", with the
                  # pull request title as the first line of the body. Use title + description instead.
                  if subject.startswith("Merge pull request") and body:
                      lines = body.split("\n", 1)
                      subject = lines[0].strip()
                      body = lines[1].strip() if len(lines) > 1 else ""
                  commits.append({
                      "hash": commit_hash,
                      "parents": parents.split(),
                      "year_month": year_month,
                      "date": iso_date[:10],
                      "subject": subject,
                      "body": body,
                  })
              return commits

          def short(year_month):
              return year_month[2:].replace("-", ".")

          def entry(version, c):
              return {"version": version, "date": c["date"], "subject": c["subject"], "body": c["body"]}

          # Release numbers always come from the Release branch only: one number per commit made
          # directly on Release (a merged pull request counts as one).
          release_ref = "HEAD" if BRANCH == "Release" else "origin/Release"

          entries = []
          counts = {}
          for c in git_log(["--first-parent", release_ref]):
              ym = c["year_month"]
              counts[ym] = counts.get(ym, 0) + 1
              version = f"{short(ym)}-{counts[ym]}"

              # A merged pull request: list the commits it brought in first, as 26.10-17-1, -2, ...
              # so people can see what happened between two releases. The release itself comes last.
              if len(c["parents"]) > 1:
                  brought_in = git_log(["--no-merges", f"{c['parents'][0]}..{c['parents'][1]}"])
                  for i, sub in enumerate(brought_in, start=1):
                      entries.append(entry(f"{version}-{i}", sub))

              entries.append(entry(version, c))

          if BRANCH == "staging":
              # Staging shows what the NEXT release will contain, with the same numbers it will get
              # there: 26.10-18-1, 26.10-18-2, ... (as long as it's released in the same month).
              this_month = datetime.now(ZoneInfo("Europe/Berlin")).strftime("%Y-%m")
              upcoming = f"{short(this_month)}-{counts.get(this_month, 0) + 1}"

              pending = git_log(["--no-merges", "origin/Release..HEAD"])
              for i, c in enumerate(pending, start=1):
                  entries.append(entry(f"{upcoming}-{i}", c))

          version = entries[-1]["version"] if entries else "00.00-0"
          with open("version.json", "w") as f:
              json.dump({"version": version}, f)

          # Newest first, capped so the file doesn't grow unbounded over the repo's life.
          changelog = list(reversed(entries))[:50]
          with open("changelog.json", "w") as f:
              json.dump(changelog, f, indent=2)

          print(f"Branch: {BRANCH}")
          print(f"Version: {version}")
          print(f"Changelog entries written: {len(changelog)}")
          EOF

      - name: Block crawlers on staging
        if: github.ref_name == 'staging' && steps.newest.outputs.deploy == 'true'
        run: |
          # Only the staging copy gets this file. The live site keeps its own robots.txt (or none).
          printf 'User-agent: *\nDisallow: /\n' > robots.txt
          echo "Wrote staging robots.txt:"
          cat robots.txt

      - name: Deploy via FTP
        if: steps.newest.outputs.deploy == 'true'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ${{ github.ref_name == 'Release' && '/public_html/' || '/staging_html/' }}

      - name: Notify Discord
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 << 'EOF'
          import os, json, urllib.request

          message = """${{ github.event.commits[0].message }}"""
          repo = "${{ github.repository }}"
          repo_name = repo.split("/")[1]
          branch = "${{ github.ref_name }}"
          actor = "${{ github.actor }}"

          # Split summary and description
          parts = message.split("\n", 1)
          body = parts[1].strip() if len(parts) > 1 else parts[0].strip()

          # Fetch GitHub display name. Signed in with the workflow's own token, because
          # anonymous requests share a small hourly limit with everyone on GitHub's servers.
          # If it still fails, fall back to the username instead of skipping the message.
          display_name = actor
          try:
            req = urllib.request.Request(
              f"https://api.github.com/users/{actor}",
              headers={
                "User-Agent": "DiscordBot (https://github.com, 1.0)",
                "Accept": "application/vnd.github+json",
                "Authorization": f"Bearer {os.environ['GITHUB_TOKEN']}"
              }
            )
            with urllib.request.urlopen(req, timeout=15) as res:
              user_data = json.loads(res.read())
            display_name = user_data.get("name") or actor
          except Exception as e:
            print(f"Could not fetch display name ({e}), using '{actor}' instead.")

          payload = {
            "username": display_name,
            "avatar_url": f"https://github.com/{actor}.png",
            "content": f"{body}\n\n- [{display_name}](<https://github.com/{actor}>) on [{repo_name}/{branch}](<https://github.com/{repo}/tree/{branch}>)"
          }

          data = json.dumps(payload).encode("utf-8")
          req = urllib.request.Request(
            os.environ["DISCORD_WEBHOOK"] + "?wait=true",
            data=data,
            headers={
              "Content-Type": "application/json",
              "User-Agent": "DiscordBot (https://github.com, 1.0)"
            },
            method="POST"
          )
          urllib.request.urlopen(req)
          EOF